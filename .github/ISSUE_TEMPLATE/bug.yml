name: Bug report
description: Report reproducible incorrect behavior
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include version, engine, mode, command or workflow, and a minimal repository example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
