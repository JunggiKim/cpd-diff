name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install and verify
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm test
          corepack pnpm typecheck
      - name: Build CLI artifact
        run: |
          corepack pnpm bundle:cli
          tar -czf cpd-diff-cli.tar.gz -C release cpd-diff.js cpd-diff.js.map
          shasum -a 256 cpd-diff-cli.tar.gz > cpd-diff-cli.tar.gz.sha256
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" cpd-diff-cli.tar.gz cpd-diff-cli.tar.gz.sha256 --generate-notes --verify-tag
